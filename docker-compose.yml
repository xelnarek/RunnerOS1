services:
  db:
    image: postgis/postgis:17-3.5
    container_name: runneros-postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: runneros
      POSTGRES_USER: runneros
      POSTGRES_PASSWORD: runneros_dev_password
    ports:
      - "5432:5432"
    volumes:
      - runneros_pgdata:/var/lib/postgresql/data
      - ./server/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U runneros -d runneros"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./server
    container_name: runneros-api
    restart: unless-stopped
    environment:
      PORT: 8787
      DATABASE_URL: postgres://runneros:runneros_dev_password@db:5432/runneros
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    ports:
      - "8787:8787"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  runneros_pgdata:
